name: Build Flipper FAP
on:
  push:
    paths:
      - "flipper/**"
      - ".github/workflows/flipper.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ufbt
      - run: cd flipper && ufbt update --channel=release && ufbt
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: flipper
          name: Озеро (Flipper)
          files: flipper/dist/*.fap
